# 04. BEHAVIOR CATALOG (DANH MỤC HÀNH VI & THAO TÁC)
# Mã định danh chuẩn: BEH-xxx
# Ánh xạ đầy đủ mọi tương tác người dùng và tác vụ nền trong Android Native BDS Collector

behaviors:
  # ==========================================
  # NHÓM 1: KHỞI ĐỘNG & ĐIỀU HƯỚNG CHUNG (NAV)
  # ==========================================
  - id: "BEH-NAV-001"
    category: "Navigation"
    name: "App Launch & Route Determination"
    trigger: "Người dùng mở ứng dụng (Fresh launch)"
    component: "MainActivity.onCreate"
    file: "MainActivity.kt:117-166"
    call_chain: "onCreate() -> prefs.getBoolean('has_shown_permission_onboarding') -> set startDestination ('property_list' hoặc 'permission_onboarding')"
    side_effects: "Khởi tạo Splash Screen, hủy notification R2 cũ, kích hoạt backgroundCoordinator.onActivated()"
    web_parity_notes: "SPA Router: kiểm tra onboarding flag trong localStorage, redirect tương ứng."

  - id: "BEH-NAV-002"
    category: "Navigation"
    name: "Bottom Navigation Bar Tab Switch"
    trigger: "Click icon trên NavigationBar"
    component: "MainActivity.bottomBar"
    file: "MainActivity.kt:243-288"
    call_chain: "NavigationBarItem.onClick -> navController.navigate(route) { popUpTo(startDestination) { saveState = true }; launchSingleTop = true; restoreState = true }"
    side_effects: "Chuyển đổi giữa 4 tab chính: property_list, unverified_list, customer_list, map_survey mà vẫn bảo toàn trạng thái cuộn."
    web_parity_notes: "SPA Navbar với NavLink / React Router có keep-alive hoặc state preservation."

  - id: "BEH-NAV-003"
    category: "Navigation"
    name: "Shortcut Check Duplicate"
    trigger: "Người dùng nhấn giữ icon app trên Launcher -> chọn 'Kiểm tra trùng'"
    component: "MainActivity.handleShortcutIntent"
    file: "MainActivity.kt:100-115, 190-197"
    call_chain: "Intent(ACTION_CHECK_DUPLICATE) -> pendingShortcutAction -> LaunchedEffect -> propertyListViewModel.openDuplicateCheckDialog('')"
    side_effects: "Mở dialog DLG-01 (DuplicateCheckDialog) trên màn hình property_list."
    web_parity_notes: "Web App Manifest shortcuts: { url: '/?action=check_duplicate' }."

  - id: "BEH-NAV-004"
    category: "Navigation"
    name: "Shortcut Add Property"
    trigger: "Nhấn shortcut 'Thêm BĐS'"
    component: "MainActivity.handleShortcutIntent"
    file: "MainActivity.kt:198-201"
    call_chain: "Intent(ACTION_ADD_PROPERTY) -> navController.navigate('property_add')"
    side_effects: "Mở form tạo BĐS chính thức SCR-03."
    web_parity_notes: "Web App Manifest shortcut url: '/properties/new'."

  - id: "BEH-NAV-005"
    category: "Navigation"
    name: "Shortcut Add Unverified"
    trigger: "Nhấn shortcut 'Thêm tin chờ'"
    component: "MainActivity.handleShortcutIntent"
    file: "MainActivity.kt:202-205"
    call_chain: "Intent(ACTION_ADD_UNVERIFIED) -> navController.navigate('property_add?isVerified=false')"
    side_effects: "Mở form tạo BĐS với cờ isVerified=false."
    web_parity_notes: "Web App Manifest shortcut url: '/properties/new?unverified=true'."

  - id: "BEH-NAV-006"
    category: "Navigation"
    name: "Share Text Intent Receiver"
    trigger: "Chia sẻ đoạn văn bản từ Zalo/Facebook/Browser sang BDS Collector"
    component: "MainActivity.onCreate"
    file: "MainActivity.kt:136-139, 173-178"
    call_chain: "Intent(ACTION_SEND, 'text/plain') -> unverifiedViewModel.setPastedText(text) -> navController.navigate('unverified_list')"
    side_effects: "Chuyển hướng sang màn hình tin chờ duyệt, tự động nạp text vào ô trích xuất."
    web_parity_notes: "Web Share Target API trong manifest.json (action: '/unverified/import', method: 'GET', params: { text: 'text' })."

  - id: "BEH-NAV-007"
    category: "Navigation"
    name: "Deep Link Open Property"
    trigger: "Click URL scheme bdsapp://property?id=..."
    component: "MainActivity.onCreate / onNewIntent"
    file: "AndroidManifest.xml:65-70; MainActivity.kt:168-171"
    call_chain: "Intent(ACTION_VIEW, 'bdsapp://property') -> parse URI -> navController.navigate('property_detail/{id}')"
    side_effects: "Mở màn hình chi tiết BĐS SCR-05."
    web_parity_notes: "Standard Web URL routing: `/property/:id`."

  # ==========================================
  # NHÓM 2: DANH SÁCH BĐS (PROPERTY LIST)
  # ==========================================
  - id: "BEH-PROP-001"
    category: "Property List"
    name: "Search Properties By Text"
    trigger: "Người dùng gõ ký tự vào ô tìm kiếm TopBar"
    component: "PropertyListScreen.SearchBar"
    file: "PropertyListScreen.kt:150-220; PropertyListViewModel.kt:110-145"
    call_chain: "onValueChange -> viewModel.setSearchQuery(query) -> filterProperties() -> normalizeForSearch() -> StateFlow<List<Property>>"
    side_effects: "Cập nhật danh sách hiển thị tức thì (không cần nhấn Enter), hỗ trợ tìm kiếm không dấu."
    web_parity_notes: "Debounced search input filter trên danh sách BĐS trong memory / client store."

  - id: "BEH-PROP-002"
    category: "Property List"
    name: "Open Filter Bottom Sheet"
    trigger: "Click icon Filter trên TopBar"
    component: "PropertyListScreen.TopAppBar"
    file: "PropertyListScreen.kt:230-245"
    call_chain: "IconButton.onClick -> showFilterBottomSheet = true"
    side_effects: "Hiển thị BottomSheet DLG-02 với các tiêu chí lọc: Giá, Diện tích, Hướng, Khu vực, Trạng thái."
    web_parity_notes: "Modal / Drawer filter trên Web."

  - id: "BEH-PROP-003"
    category: "Property List"
    name: "Apply Property Filters"
    trigger: "Chọn các chip lọc trong FilterBottomSheet"
    component: "PropertyFilterBottomSheet"
    file: "PropertyFilterBottomSheet.kt:50-280; PropertyListViewModel.kt:150-210"
    call_chain: "onFilterChange(newFilter) -> viewModel.updateFilter(newFilter) -> filterProperties() -> recalculate filteredCount"
    side_effects: "Lọc kết hợp đa tiêu chí (AND giữa các nhóm, OR trong cùng nhóm), hiển thị badge số lượng bộ lọc đang hoạt động."
    web_parity_notes: "Sync state bộ lọc vào URL query params để có thể bookmark/refresh."

  - id: "BEH-PROP-004"
    category: "Property List"
    name: "Reset Property Filter"
    trigger: "Click nút 'Về bộ lọc cài đặt' / 'Xóa bộ lọc'"
    component: "PropertyFilterBottomSheet.StickyFilterFooter"
    file: "PropertyFilterBottomSheet.kt:290-315; PropertyListViewModel.kt:215-230"
    call_chain: "Button.onClick -> viewModel.restoreConfiguredFilter() -> load baseline filter from SettingsManager"
    side_effects: "Khôi phục bộ lọc về cấu hình mặc định (Nhớ lần trước hoặc cấu hình cố định)."
    web_parity_notes: "Reset filter state và query params về default."

  - id: "BEH-PROP-005"
    category: "Property List"
    name: "Toggle Need To View Today"
    trigger: "Click icon Lịch / 'Cần xem hôm nay' trên PropertyCard"
    component: "PropertyCard"
    file: "PropertyCard.kt:120-145; PropertyListViewModel.kt:320-345"
    call_chain: "IconButton.onClick -> viewModel.toggleNeedToViewToday(property) -> propertyRepository.updateNeedToViewToday(id, !current) -> pushToSupabase"
    side_effects: "Cập nhật Room DB, đổi màu icon, kích hoạt CAS sync đẩy lên Supabase."
    web_parity_notes: "Mutation gọi API update `need_to_view_today` + optimistic UI update."

  - id: "BEH-PROP-006"
    category: "Property List"
    name: "Toggle Property Status Quick Action"
    trigger: "Click badge trạng thái trên PropertyCard (Đang bán <-> Tạm ngưng/Đã chốt)"
    component: "PropertyCard"
    file: "PropertyCard.kt:150-180; PropertyListViewModel.kt:350-375"
    call_chain: "Badge.clickable -> viewModel.toggleStatus(property) -> propertyRepository.updateStatus(id, newStatus)"
    side_effects: "Cập nhật trạng thái giao dịch trong Room DB, đánh dấu isTextSynced = false."
    web_parity_notes: "Dropdown hoặc click-to-cycle status trên card."

  - id: "BEH-PROP-007"
    category: "Property List"
    name: "Multi-Select Mode & Delete Selected"
    trigger: "Long press vào PropertyCard hoặc click nút chọn nhiều trên TopBar"
    component: "PropertyListScreen"
    file: "PropertyListScreen.kt:310-380; PropertyListViewModel.kt:400-450"
    call_chain: "onToggleSelect(id) -> selectedIds.add/remove -> Click Delete Selected -> viewModel.deleteSelected() -> soft delete list trong Room"
    side_effects: "Đặt isDeleted = true, cập nhật updatedAt = now(), lên lịch push sync."
    web_parity_notes: "Checkbox multi-select + sticky bulk-action bar."

  - id: "BEH-PROP-008"
    category: "Property List"
    name: "FAB Drag Left/Right"
    trigger: "Kéo ngang nút thêm nhanh (FAB)"
    component: "PropertyListScreen.FloatingActionButton"
    file: "PropertyListScreen.kt:420-460"
    call_chain: "pointerInput(detectHorizontalDragGestures) -> animateIntOffsetAsState -> viewModel.setFabPosition(isLeft)"
    side_effects: "Di chuyển FAB sang mép trái hoặc mép phải màn hình để thuận tiện thao tác 1 tay; lưu vị trí vào SettingsManager."
    web_parity_notes: "Trên Desktop/Mobile Web có thể giữ FAB cố định góc dưới phải hoặc tùy biến."

  - id: "BEH-PROP-009"
    category: "Property List"
    name: "Reveal Hidden Item From Snackbar"
    trigger: "Khi có BĐS mới đồng bộ về nhưng bị bộ lọc ẩn -> click 'Xem ngay' trên Snackbar"
    component: "PropertyListScreen.LaunchedEffect"
    file: "PropertyListScreen.kt:105-116; PropertyListViewModel.kt:250-280"
    call_chain: "SnackbarResult.ActionPerformed -> viewModel.revealHiddenItem(info) -> tạm thời mở rộng filter để hiển thị BĐS đó"
    side_effects: "Bộ lọc tự động nới lỏng để hiển thị BĐS vừa được tạo/đồng bộ."
    web_parity_notes: "Toast notification kèm action 'View item' tự mở rộng filter."

  # ==========================================
  # NHÓM 3: FORM THÊM & SỬA BĐS (PROPERTY FORM)
  # ==========================================
  - id: "BEH-FORM-001"
    category: "Property Form"
    name: "Fetch GPS Current Location"
    trigger: "Click icon định vị GPS cạnh ô tọa độ trong form"
    component: "PropertyFormScreen.LocationPicker"
