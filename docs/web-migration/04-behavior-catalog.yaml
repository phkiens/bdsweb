    side_effects: "Điền tự động vĩ độ, kinh độ hiện tại vào form; nếu bật reverseGeocoding thì tự động tra cứu địa chỉ."
    web_parity_notes: "Navigator.geolocation.getCurrentPosition() (Yêu cầu HTTPS)."

  - id: "BEH-FORM-002"
    category: "Property Form"
    name: "Pick Images From Gallery"
    trigger: "Click nút 'Thêm ảnh từ thư viện'"
    component: "PropertyFormScreen.MediaSection"
    file: "PropertyFormScreen.kt:310-350"
    call_chain: "rememberLauncherForActivityResult(ActivityResultContracts.GetMultipleContents()) -> uriList -> PrepareImageUseCase -> save to local cache"
    side_effects: "Copy ảnh vào thư mục files/photos/, nén ảnh nếu dung lượng lớn, tạo thumbnail, thêm URI vào localMediaList."
    web_parity_notes: "<input type='file' multiple accept='image/*'> -> FileReader / ObjectURL."

  - id: "BEH-FORM-003"
    category: "Property Form"
    name: "Capture Photo From Camera"
    trigger: "Click nút 'Chụp ảnh mới'"
    component: "PropertyFormScreen.MediaSection"
    file: "PropertyFormScreen.kt:355-390; FileProvider.kt"
    call_chain: "rememberLauncherForActivityResult(ActivityResultContracts.TakePicture()) -> temp FileProvider URI -> camera intent -> save"
    side_effects: "Mở Camera native, chụp và lưu ảnh vào bộ nhớ app cache."
    web_parity_notes: "<input type='file' accept='image/*' capture='environment'> trên Mobile Web."

  - id: "BEH-FORM-004"
    category: "Property Form"
    name: "Auto-Fill From Raw Listing Text"
    trigger: "Dán đoạn văn bản mô tả BĐS vào ô trích xuất nhanh -> click 'Trích xuất'"
    component: "PropertyFormScreen.QuickExtractSection"
    file: "PropertyFormScreen.kt:410-460; GeminiHelper.kt:50-120"
    call_chain: "Button.onClick -> GeminiHelper.extractProperty() (hoặc regex fallback) -> điền vào title, price, area, address, phone, contactName"
    side_effects: "Bóc tách tự động thông tin có cấu trúc, điền vào các trường form để người dùng kiểm tra lại."
    web_parity_notes: "Gọi backend API endpoint `/api/extract` (Gemini API server-side để bảo mật API key)."

  - id: "BEH-FORM-005"
    category: "Property Form"
    name: "Submit Property Form (Insert / Update)"
    trigger: "Click nút 'Lưu BĐS' trên TopBar"
    component: "PropertyFormScreen.TopBar"
    file: "PropertyFormScreen.kt:120-160; PropertyFormViewModel.kt:350-450"
    call_chain: "TopBar Save Button.onClick -> validateForm() -> AddPropertyUseCase / UpdatePropertyUseCase -> PropertyRepository -> Room DAO -> trigger sync"
    side_effects: "Lưu bản ghi vào Room DB với isTextSynced=false, trigger WorkManager hoặc coroutine push lên Supabase, upload media lên R2."
    web_parity_notes: "Form submit -> validate -> LocalStorage/IndexedDB lưu tạm + POST/PUT lên API Supabase."

